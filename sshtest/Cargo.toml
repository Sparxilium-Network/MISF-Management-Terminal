[package]
name = "misf-sshtest"
version = "0.1.0"
edition = "2024"
description = "APT fault tests for MISF against a real Debian/Ubuntu container"
license-file = "../LICENSE"
publish = false

[dependencies]
misf-core = { path = "../core" }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "io-util", "net", "sync"] }
