[package]
name = "misf-sshtest"
version = "0.1.0"
edition = "2024"
description = "Package-manager fault tests for MISF against real containers"
license-file = "../LICENSE"
publish = false

[dependencies]
misf-core = { path = "../core" }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "io-util", "net", "sync"] }

# One test target per package manager, each in its own directory with its image.
[[test]]
name = "apt"
path = "apt/main.rs"

[[test]]
name = "dnf"
path = "dnf/main.rs"

[[test]]
name = "pacman"
path = "pacman/main.rs"

[[test]]
name = "apk"
path = "apk/main.rs"
