[package]
name = "misf"
version = "0.1.0"
edition = "2024"
description = "MISF Management Terminal"
license-file = "../LICENSE"
publish = false

[build-dependencies]
winresource = "0.1.34"
slint-build = "1.18.1"

[features]
capture = ["dep:image"]

[dependencies]
misf-core = { path = "../core" }
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-skia", "accessibility", "unstable-winit-030"] }
rfd = "0.17.2"
serde_json = "1.0.154"
chrono = "0.4.45"
zeroize = "1.9.1"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync"] }
image = { version = "0.25.10", default-features = false, features = ["png"], optional = true }

[dev-dependencies]
i-slint-backend-testing = "=1.18.1"
