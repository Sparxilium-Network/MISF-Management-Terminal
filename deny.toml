# cargo-deny policy. Licences: every dependency must have a licence compatible
# with distributing MISF under the GNU AGPL v3 (CI runs: cargo deny check licenses).
# Advisories: the whole check (cargo deny check) should pass locally.
[graph]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]

[advisories]
# Known "unmaintained" notices (not vulnerabilities) for crates that only reach
# MISF through Slint 1.18.1. Remove each entry once a Slint/winit upgrade drops it.
ignore = [
    { id = "RUSTSEC-2026-0441", reason = "pin-utils via Slint's spin_on; build-time and renderer helper, no fix needed" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser via winit sctk-adwaita; Linux Wayland title bar only" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names merged into zbus 6; via AccessKit AT-SPI, Linux accessibility only" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant merged into zbus 6; via AccessKit AT-SPI, Linux accessibility only" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive merged into zbus 6; via AccessKit AT-SPI, Linux accessibility only" },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "0BSD",
    "Unlicense",
    "Unicode-3.0",
    # Slint (the GUI) is used under its GPL-3.0-only option, which AGPL v3 section 13
    # allows combining with MISF.
    "GPL-3.0-only",
]
confidence-threshold = 0.9
# MISF's own crates (AGPL-3.0, root LICENSE) and the local LUKSbox FIDO2 copy.
private = { ignore = true }
