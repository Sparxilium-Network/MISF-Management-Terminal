[package]
name = "misf-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
fs2 = "0.4"
russh = { version = "0.65.0", default-features = false, features = ["ring", "rsa"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util", "net"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
rand = "0.10"
